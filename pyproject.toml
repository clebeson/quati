[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quati"
version = "0.1.0"
description = "Quati S00 local CLI and identity; discovery and live gates remain unqualified"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0", "typer==0.28.0", "platformdirs==4.14.5", "cryptography==50.0.2"]

[project.optional-dependencies]
live = ["pydantic-ai-slim[openai]==2.68.0", "openai==3.51.0", "anthropic==2.8.0"]
test = ["pytest==9.2.0", "coverage==7.16.1"]

[project.scripts]
quati = "quati.cli.main:main"

# The wheel carries the contract schemas and the active behavior package, statecharts and default LOCAL policy
# as package data under quati/assets, laid out as in the repository (contracts/, examples/...), so an installed
# copy needs no repository checkout (quati.behavior.contracts.asset_root). The files stay where they are in
# the repository: each asset directory is mapped as a data-only package. The package list is explicit because
# of that mapping; tests/unit/test_s00_integration7.py checks it against the source tree.
[tool.setuptools]
packages = [
    "quati", "quati.adapters", "quati.adapters.providers", "quati.application", "quati.behavior", "quati.cli",
    "quati.domain",
    "quati.assets.contracts", "quati.assets.examples.behavior", "quati.assets.examples.statecharts",
    "quati.assets.examples.policies",
]

[tool.setuptools.package-dir]
"" = "src"
"quati.assets.contracts" = "contracts"
"quati.assets.examples.behavior" = "examples/behavior"
"quati.assets.examples.statecharts" = "examples/statecharts"
"quati.assets.examples.policies" = "examples/policies"

[tool.setuptools.package-data]
"quati.assets.contracts" = ["*.json"]
"quati.assets.examples.behavior" = ["*.yaml", "*.json"]
"quati.assets.examples.statecharts" = ["*.yaml"]
"quati.assets.examples.policies" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: requires an authorized actual LLM provider"]
