[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secma"
version = "0.1.0"
description = "SECMA S00 read-only fixture discovery prototype; live gate not yet verified"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
live = ["pydantic-ai-slim[openai]==2.68.0", "openai==3.51.0"]
test = ["pytest==9.2.0"]

[project.scripts]
secma = "secma.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secma = ["assets/contracts/*.json", "assets/examples/statecharts/*.yaml", "assets/examples/behavior/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: requires an authorized actual LLM provider"]
